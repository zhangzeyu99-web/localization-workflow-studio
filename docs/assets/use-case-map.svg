<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Localization Workflow Studio use-case map</title>
  <desc id="desc">Three tested workflow paths: mock regression, real project replay, and real provider smoke.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10172a"/>
      <stop offset="58%" stop-color="#172448"/>
      <stop offset="100%" stop-color="#123b5d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6ee7f9"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect x="48" y="42" width="1184" height="636" rx="26" fill="#0f172a" opacity="0.42" stroke="#334155"/>
  <text x="84" y="104" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="700">Localization Workflow Studio</text>
  <text x="86" y="142" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="18">Tested paths from web UI to backend workflow artifacts</text>

  <g filter="url(#shadow)">
    <rect x="84" y="200" width="320" height="330" rx="18" fill="#172033" stroke="#475569"/>
    <rect x="480" y="200" width="320" height="330" rx="18" fill="#172033" stroke="#475569"/>
    <rect x="876" y="200" width="320" height="330" rx="18" fill="#172033" stroke="#475569"/>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="116" y="252" fill="#67e8f9" font-size="24" font-weight="700">1. Mock EN Regression</text>
    <text x="116" y="298" fill="#e2e8f0" font-size="17">Create project</text>
    <text x="116" y="332" fill="#e2e8f0" font-size="17">Upload synthetic workbook</text>
    <text x="116" y="366" fill="#e2e8f0" font-size="17">Mock provider JSONL</text>
    <text x="116" y="400" fill="#e2e8f0" font-size="17">QA gate and download</text>

    <text x="512" y="252" fill="#c4b5fd" font-size="24" font-weight="700">2. Real Project Replay</text>
    <text x="512" y="298" fill="#e2e8f0" font-size="17">Use recent workbook</text>
    <text x="512" y="332" fill="#e2e8f0" font-size="17">Reuse term base</text>
    <text x="512" y="366" fill="#e2e8f0" font-size="17">Archive glossary outputs</text>
    <text x="512" y="400" fill="#e2e8f0" font-size="17">Verify persisted artifacts</text>

    <text x="908" y="252" fill="#86efac" font-size="24" font-weight="700">3. Real Provider Smoke</text>
    <text x="908" y="298" fill="#e2e8f0" font-size="17">Configure local settings</text>
    <text x="908" y="332" fill="#e2e8f0" font-size="17">Chat Completions default</text>
    <text x="908" y="366" fill="#e2e8f0" font-size="17">Responses optional</text>
    <text x="908" y="400" fill="#e2e8f0" font-size="17">Small EN workbook first</text>
  </g>

  <g fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round">
    <path d="M404 365 C438 365 446 365 480 365"/>
    <path d="M800 365 C834 365 842 365 876 365"/>
  </g>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="15">
    <rect x="151" y="572" width="978" height="60" rx="18" fill="#0b1220" stroke="#334155"/>
    <text x="188" y="609" fill="#f8fafc">Shared backbone: React/Vite UI -> FastAPI -> SQLite data root -> workflow adapters -> artifacts</text>
  </g>

  <g fill="url(#accent)">
    <circle cx="106" cy="104" r="8"/>
    <circle cx="1138" cy="104" r="8"/>
    <circle cx="1164" cy="104" r="8"/>
    <circle cx="1190" cy="104" r="8"/>
  </g>
</svg>
