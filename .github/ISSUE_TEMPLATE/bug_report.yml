name: Bug report
description: Report a reproducible defect in the studio workflow.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What broke, and what should have happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include exact project, workbook, command, or web path.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Paste errors, run IDs, artifact paths, screenshots, or CI links.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Frontend
        - Backend API
        - Localization workflow
        - Glossary workflow
        - Provider adapter
        - QA / artifact output
        - CI / tests
    validations:
      required: true
