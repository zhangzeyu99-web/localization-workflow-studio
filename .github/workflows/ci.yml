name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Backend mock E2E
        run: python -m pytest -q
      - name: Localization workflow baseline
        working-directory: workflow/localization
        run: python -m pytest -q
      - name: Glossary workflow baseline
        working-directory: workflow/glossary
        run: python -m pytest -q
      - name: Frontend build
        working-directory: frontend
        run: |
          npm install
          npm run build
